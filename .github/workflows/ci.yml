name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # npm ci ではなく npm install を使う。
      # Next 16 と eslint-config-next が引きずる wasm32-wasi 向けの任意バイナリ
      # （@napi-rs/wasm-runtime → @emnapi/runtime の alpha 版）は、
      # インストール先のプラットフォームによって解決結果が変わり、
      # ロックファイルに書き出せないため npm ci が同期エラーで落ちる。
      # 該当のバイナリは実行時に読み込まれないので、install で差し支えない。
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 実在の人物・政党・団体を想起させる語が UI 文言に混入していないか検査する。
      # 混入したらビルドを失敗させる（表示されてからでは遅いため）。
      - run: npm run check:words
      - run: npm run build
